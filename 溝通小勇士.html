<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>溝通小勇士</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 平板單頁 app — 首頁單元卡 → 動畫舞台(16:10)＋旁白／對話列 → 遊戲卡 → 自評；刻意採明亮教室單一配色；國字右側直排注音 */
:root{
  --sky:#E4F1F6; --paper:#FFFFFF; --ink:#22314A; --ink-soft:#5A6B84; --line:#C3D6E2;
  --sun:#FFC845; --leaf:#2FA36B; --coral:#E8604F; --blue:#2F6FD0;
  --t1:#BBD7FF; --t2:#FFE08A; --t3:#BDEBCB;
  --wall:#D6EAD8; --floor:#E2B77E; --board:#2E5E4A; --wood:#9C6B3C;
  --sky-out:#BFE3F5; --grass:#8FD18A; --wall-home:#F6DCCB; --floor-home:#B9C7D9;
  --f-display:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 32px;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
.wrap{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}

/* 注音：國字右側直排，聲調在右 */
.zc{display:inline-flex;align-items:center;white-space:nowrap}
.zc .b{display:inline-flex;align-items:center;font-family:var(--f-body);font-weight:500;font-size:.42em;line-height:1;margin-left:.1em;margin-right:.08em}
.zc .bs{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-.08em}
.zc .bs i{font-style:normal}
.zc .t{margin-left:.04em}
body.nozy .zc .b{display:none}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.7rem;margin-right:auto}
.brand .mark{width:44px;height:44px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font-size:1.3rem}
.tbtn{min-height:52px;padding:0 16px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.tbtn.off{background:#EEF2F5;color:var(--ink-soft)}

/* home */
.hello{display:flex;flex-direction:column;gap:4px}
.hello h1{font-family:var(--f-display);font-size:clamp(1.6rem,3.4vw,2.4rem);margin:0;text-wrap:balance}
.hello p{margin:0;color:var(--ink-soft);font-size:1.15rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ucard{position:relative;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:210px;box-shadow:0 5px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.ucard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.uicon{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--tone) 22%,white);border:3px solid var(--tone)}
.uweek{font-size:.85rem;font-weight:700;color:var(--ink-soft);letter-spacing:.06em}
.utitle{font-family:var(--f-display);font-size:1.55rem;font-weight:700;line-height:1.3}
.ugoal{font-size:1rem;color:var(--ink-soft);line-height:1.6}
.ustate{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.uself{font-size:1.6rem}
.stars{letter-spacing:2px;font-size:1.35rem}
.stars i{font-style:normal;color:#D5DEE6}
.stars i.on{color:#F2B01E;-webkit-text-stroke:1px #B07A00}

/* unit */
.uhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.uhead .meta{margin-right:auto;min-width:0}
.uhead h2{font-family:var(--f-display);font-size:clamp(1.5rem,3vw,2.1rem);margin:0;line-height:1.25}
.uhead small{display:block;color:var(--ink-soft);font-weight:700;letter-spacing:.04em}
.uhead p{margin:2px 0 0;color:var(--ink-soft);font-size:1.05rem}
.stage-wrap{width:100%;max-width:calc(52vh * 1.6);margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;border:3px solid var(--ink);container-type:inline-size;background:var(--wall)}
.bg-class{background:linear-gradient(var(--wall) 0 72%,var(--floor) 72%)}
.bg-play{background:linear-gradient(var(--sky-out) 0 62%,var(--grass) 62%)}
.bg-home{background:linear-gradient(var(--wall-home) 0 70%,var(--floor-home) 70%)}
.board{position:absolute;top:7%;left:32%;width:36%;height:30%;background:var(--board);border:1.2cqw solid var(--wood);border-radius:1cqw}
.board::after{content:"";position:absolute;left:12%;right:30%;top:30%;height:.5cqw;background:rgba(255,255,255,.35);box-shadow:0 3cqw 0 rgba(255,255,255,.25)}
.win{position:absolute;top:10%;left:5%;width:14%;height:24%;background:var(--sky-out);border:1cqw solid #fff;border-radius:1cqw;box-shadow:0 0 0 .4cqw var(--ink)}
.sun{position:absolute;top:8%;right:8%;width:10cqw;height:10cqw;border-radius:50%;background:var(--sun);box-shadow:0 0 0 1.5cqw rgba(255,200,69,.35)}
.tree{position:absolute;bottom:36%;left:44%;width:12cqw;height:12cqw;border-radius:50%;background:#5DB866;box-shadow:inset -1.5cqw -1.5cqw 0 #4AA455}
.actor{position:absolute;bottom:2.5%;width:22%}
.actor.L{left:13%}.actor.R{right:13%}
.actor svg{display:block;width:100%;height:auto}
.name{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);background:var(--paper);border:.35cqw solid var(--ink);border-radius:999px;font-size:2.2cqw;font-weight:700;padding:.1em .8em;white-space:nowrap}
.bubble{position:absolute;bottom:101%;background:var(--paper);border:.45cqw solid var(--ink);border-radius:2cqw;padding:1cqw 1.6cqw 1cqw 2cqw;font-family:var(--f-display);font-size:3.6cqw;font-weight:700;line-height:1.35;width:max-content;max-width:58cqw;z-index:3;animation:pop .35s ease-out;display:flex;align-items:center;gap:1cqw}
.bubble .btxt{min-width:0}
.L .bubble{left:-8%}.R .bubble{right:-8%}
.bubble::after{content:"";position:absolute;top:100%;border:1.4cqw solid transparent;border-top-color:var(--ink)}
.L .bubble::after{left:26%}.R .bubble::after{right:26%}
.bubble.quiet{font-size:2.7cqw;font-weight:400;color:var(--ink-soft);border-style:dashed}
.bsay{flex:none;width:5.2cqw;height:5.2cqw;min-width:30px;min-height:30px;border-radius:50%;border:.35cqw solid var(--ink);background:var(--t2);font-size:2.4cqw;display:grid;place-items:center;padding:0}
.think{position:absolute;top:-4%;width:11cqw;height:11cqw;border-radius:50%;background:var(--paper);border:.4cqw solid var(--ink);display:grid;place-items:center;font-size:6cqw;z-index:2;animation:pop .4s ease-out}
.L .think{left:84%}.R .think{right:84%}
.prop{position:absolute;bottom:20%;font-size:7.5cqw;z-index:2}
.L .prop{left:78%}.R .prop{right:78%}
.hand{position:absolute;top:26%;font-size:6.5cqw;z-index:2;animation:wave .9s ease-in-out infinite alternate}
.L .hand{left:80%}.R .hand{right:80%}
.stamp{position:absolute;top:4%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:1cqw;background:var(--paper);border:.5cqw solid;border-radius:999px;padding:.5cqw 2.4cqw .5cqw .6cqw;font-size:3.4cqw;font-weight:700;z-index:4;animation:stamp .45s ease-out;white-space:nowrap}
.stamp b{width:6cqw;height:6cqw;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:4cqw}
.stamp.good{border-color:var(--leaf);color:var(--leaf)}.stamp.good b{background:var(--leaf)}
.stamp.bad{border-color:var(--coral);color:var(--coral)}.stamp.bad b{background:var(--coral)}
.stage.talking .speaker .mouth{animation:talk .22s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.tiles{position:absolute;top:6%;left:50%;transform:translateX(-50%);display:flex;align-items:flex-start;gap:1.2cqw;z-index:4;animation:popc .4s ease-out}
.tile{border:.45cqw solid var(--ink);border-radius:1.6cqw;padding:.8cqw 2cqw;font-family:var(--f-display);font-size:5cqw;font-weight:700;text-align:center;line-height:1.2}
.tile small{display:block;font-family:var(--f-body);font-size:2.4cqw;font-weight:700;color:var(--ink-soft)}
.plus{font-size:4cqw;font-weight:700;padding-top:1.4cqw;color:var(--paper);text-shadow:0 0 .6cqw var(--ink)}
.c1{background:var(--t1)}.c2{background:var(--t2)}.c3{background:var(--t3)}
.meter{position:absolute;top:5%;left:50%;transform:translateX(-50%);display:flex;align-items:flex-end;gap:1.2cqw;background:var(--paper);border:.45cqw solid var(--ink);border-radius:2cqw;padding:1.4cqw 2cqw;z-index:4;animation:popc .4s ease-out}
.meter .bar{width:5cqw;border-radius:1cqw;display:flex;align-items:flex-end;justify-content:center;color:#fff;font-weight:700;font-size:2.6cqw;padding-bottom:.3cqw;transition:opacity .3s}
.meter .bar.dim{opacity:.22}
.meter .mlabel{font-family:var(--f-display);font-weight:700;font-size:3.6cqw;margin-left:1.2cqw;align-self:center;white-space:nowrap}
.practice{position:absolute;inset:0;background:rgba(34,49,74,.55);display:grid;place-items:center;z-index:6;padding:3cqw}
.pcard{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:3cqw 4cqw;display:flex;flex-direction:column;align-items:center;gap:2cqw;text-align:center;max-width:94%;animation:pop .35s ease-out}
.plabel{font-weight:700;color:var(--blue);font-size:clamp(1rem,2.6cqw,1.5rem)}
.psent{font-family:var(--f-display);font-weight:700;font-size:clamp(1.4rem,5.4cqw,3rem);line-height:1.35}
.pyay{font-size:clamp(2rem,7cqw,4rem);line-height:1}
.prow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* 旁白與對話列 */
.cap,.line{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 12px}
.line{border-color:var(--who,var(--ink));background:color-mix(in srgb,var(--who,#fff) 10%,white)}
.cap p,.line p{margin:0;font-family:var(--f-display);font-size:clamp(1.3rem,2.6vw,1.85rem);font-weight:700;line-height:1.45;flex:1;min-width:0}
.who{flex:none;min-width:64px;text-align:center;border-radius:999px;padding:4px 10px;font-weight:700;font-size:1.05rem;color:#fff;background:var(--who,var(--ink-soft))}
.sayb{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--ink);background:var(--t1);font-size:1.5rem;display:grid;place-items:center;padding:0}
.line .sayb{background:var(--t2)}
.ctrl{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{min-height:58px;padding:0 20px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);font-weight:700;font-size:1.15rem;box-shadow:0 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.go{background:var(--sun)}
.btn.play{background:var(--leaf);color:#fff;min-width:150px}
.btn.ghost{box-shadow:none}
.dots{display:flex;justify-content:center;gap:8px}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots span.done{background:var(--ink-soft)}
.dots span.on{background:var(--blue);transform:scale(1.35)}

/* game */
.gcard{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:clamp(16px,3vw,28px);display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center}
.gtop{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gtop b{font-family:var(--f-display);font-size:1.45rem}
.gnum{font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:1.1rem}
.gbody{width:100%;display:flex;flex-direction:column;gap:16px;align-items:center}
.qpic{font-size:clamp(3.6rem,10vw,6rem);line-height:1.1}
.qtext{display:flex;align-items:center;gap:12px;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3vw,2.2rem);line-height:1.4;text-wrap:balance}
.opts{width:100%;max-width:700px;display:flex;flex-direction:column;gap:12px}
.optrow{display:flex;align-items:center;gap:10px}
.optrow .sayb{background:var(--t2)}
.opt{flex:1;min-width:0;min-height:76px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.45;padding:10px 18px;box-shadow:0 4px 0 var(--ink)}
.opt.right,.ocard.picked,.vbtn.right{background:var(--t3);border-color:var(--leaf)}
.opt.wrong,.vbtn.wrong{background:#FBD9D3;border-color:var(--coral);animation:shake .4s}
.ocards{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.owrap{position:relative;display:flex}
.ocard{flex:1;position:relative;min-height:120px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:clamp(1.25rem,2.4vw,1.6rem);line-height:1.45;padding:14px 14px 14px 14px;box-shadow:0 4px 0 var(--ink)}
.ocard.wrong{animation:shake .4s;border-color:var(--coral)}
.ocard .badge{position:absolute;top:-14px;left:-10px;width:40px;height:40px;border-radius:50%;background:var(--leaf);color:#fff;display:grid;place-items:center;font-family:var(--f-body);font-size:1.2rem;border:3px solid var(--ink)}
.owrap .sayb{position:absolute;top:-16px;right:-8px;width:46px;height:46px;font-size:1.2rem;background:var(--t2);z-index:1}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{min-width:130px;min-height:90px;border:3px dashed var(--ink-soft);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3vw,2.1rem);padding:6px 12px;background:transparent}
.slot small{font-family:var(--f-body);font-size:1rem;color:var(--ink-soft);font-weight:700}
.slot.filled{border-style:solid;border-color:var(--ink)}
.tilesrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ptile{min-width:120px;min-height:76px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3vw,2.1rem);box-shadow:0 4px 0 var(--ink);padding:0 16px}
.ptile.used{visibility:hidden}
.ptile.wrong{animation:shake .4s;border-color:var(--coral)}
.vrow{display:flex;align-items:flex-end;gap:10px;justify-content:center;flex-wrap:wrap}
.vbtn{width:clamp(70px,14vw,104px);border:3px solid var(--ink);border-radius:16px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:8px 4px;box-shadow:0 4px 0 var(--ink)}
.vbtn .vb{width:60%;border-radius:8px}
.vbtn b{font-size:1.5rem}
.vbtn span{font-size:1rem;font-weight:700;color:var(--ink-soft)}
.fb{min-height:2.2em;font-family:var(--f-display);font-weight:700;font-size:clamp(1.35rem,2.6vw,1.85rem)}
.fb.ok{color:var(--leaf)}.fb.no{color:var(--coral)}

/* result */
.rstars{font-size:clamp(3.4rem,10vw,5.5rem);letter-spacing:6px}
.rstars i{display:inline-block;font-style:normal;animation:pop .5s ease-out backwards}
.rstars i:nth-child(2){animation-delay:.2s}.rstars i:nth-child(3){animation-delay:.4s}
.rtitle{font-family:var(--f-display);font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:700;margin:0;line-height:1.4}
.keys{width:100%;max-width:620px;display:flex;flex-direction:column;gap:10px}
.key{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:14px;padding:8px 12px;text-align:left}
.key span.k{font-family:var(--f-display);font-weight:700;font-size:1.5rem;flex:1;line-height:1.45}
.key .sayb{background:var(--t2)}
.selfq{font-weight:700;font-size:1.25rem}
.selfrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.selfb{width:clamp(120px,25vw,160px);min-height:124px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:1.1rem;box-shadow:0 4px 0 var(--ink)}
.selfb em{font-style:normal;font-size:2.8rem;line-height:1}
.selfb.on{background:var(--t2);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* record */
.rec{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.rec h2{font-family:var(--f-display);margin:0;font-size:1.8rem}
.rec p{margin:0;color:var(--ink-soft);font-size:.95rem}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.85rem;color:var(--ink-soft);letter-spacing:.05em}
td small{display:block;color:var(--ink-soft);font-size:.8rem}
td.num{font-variant-numeric:tabular-nums;text-align:center}
.recbtns{display:flex;gap:10px;flex-wrap:wrap}
.btn.warn{background:#FBD9D3}

/* 聲音設定 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(34,49,74,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mbox{width:100%;max-width:880px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mhead h2{margin:0;font-family:var(--f-display);font-size:1.8rem}
.mopts{display:flex;gap:20px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:10px;font-weight:700;min-height:44px}
.chk input{width:26px;height:26px;accent-color:var(--blue)}
.mnote{margin:0;color:var(--ink-soft);font-size:.92rem}
.vroles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vrole{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.vwho{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.vwho .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink)}
.vrole label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:700;color:var(--ink-soft)}
.vrole select{min-height:44px;border:2px solid var(--ink);border-radius:10px;padding:0 8px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--paper);width:100%}
.vrange{display:flex;align-items:center;gap:10px}
.vrange input{flex:1;min-width:0;height:32px;accent-color:var(--blue)}
.vrange output{width:3.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.vrole .btn{min-height:50px}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes stamp{from{transform:translateX(-50%) scale(1.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes popc{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:560px){.btn{padding:0 14px}.btn.play{min-width:120px}.sayb{width:50px;height:50px}}
</style>

<div class="wrap">
  <header class="top">
    <button class="tbtn" id="back" hidden aria-label="回首頁" data-zy>← 首頁</button>
    <div class="brand"><span class="mark">💬</span><span data-zy>溝通小勇士</span></div>
    <button class="tbtn" id="snd" aria-pressed="true">🔊 聲音開</button>
    <button class="tbtn" id="vBtn">🎙️ 聲音設定</button>
    <button class="tbtn" id="recBtn">📒 學習紀錄</button>

  <main id="home">
    <div class="wrap">
      <div class="hello">
        <h1 data-zy>今天想練習哪一個？</h1>
        <p data-zy>先看動畫學說話，再玩遊戲，最後看看自己學會了沒有。</p>
      </div>
      <div class="units" id="units"></div>
    </div>
  </main>

  <main id="unit" hidden>
    <div class="wrap">
      <div class="uhead">
        <div class="meta"><small id="uWeek"></small><h2 id="uTitle"></h2><p id="uGoal"></p></div>
        <button class="btn go" id="toGame" data-zy>🎮 玩遊戲</button>
      </div>
      <div class="stage-wrap">
        <div class="stage" id="stage"></div>
        <div class="cap"><span class="who" data-zy>旁白</span><p id="capText"></p><button class="sayb" id="capSay" aria-label="聽旁白">🔊</button></div>
        <div class="line" id="line" hidden><span class="who" id="lineWho"></span><p id="lineText"></p><button class="sayb" id="lineSay" aria-label="聽角色說話">🔊</button></div>
        <div class="ctrl">
          <button class="btn" id="prev" data-zy>◀ 上一步</button>
          <button class="btn play" id="play"></button>
          <button class="btn" id="next" data-zy>下一步 ▶</button>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
  </main>

  <main id="game" hidden>
    <div class="gcard">
      <div class="gtop"><b id="gTitle"></b><span class="gnum" id="gNum"></span></div>
      <div class="gbody" id="gBody"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="ctrl"><button class="btn ghost" id="toStory" data-zy>🎬 回去看動畫</button><button class="btn go" id="gNext" hidden></button></div>
    </div>
  </main>

  <main id="result" hidden>
    <div class="gcard" id="resBody"></div>
  </main>

  <main id="record" hidden>
    <section class="rec">
      <h2>學習紀錄</h2>
      <p>給老師看：每個單元的遊戲星星（取最高）、學生自評、按下「我說好了」的開口練習次數。紀錄只存在這台平板的瀏覽器裡，清除瀏覽資料就會不見。</p>
      <div class="tscroll"><table>
        <thead><tr><th>單元</th><th>遊戲星星</th><th>學生自評</th><th>開口練習</th><th>遊戲次數</th><th>最近練習</th></tr></thead>
        <tbody id="recBody"></tbody>
      </table></div>
      <div class="recbtns"><button class="btn" id="copyRec">📋 複製紀錄文字</button><button class="btn warn" id="resetRec">清除紀錄</button></div>
      <p id="recMsg" aria-live="polite"></p>
    </section>
  </main>
</div>

<div class="modal" id="vModal" hidden>
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="vTitle">
    <div class="mhead"><h2 id="vTitle">聲音設定</h2><button class="btn go" id="vClose">完成</button></div>
    <div class="mopts">

    <p class="mnote" id="vNote"></p>
    <div class="vroles" id="vRoles"></div>
    <div class="recbtns"><button class="btn" id="vReset">恢復預設</button></div>
  </div>
</div>

/* ---------- 人物 ---------- */
const PEOPLE={
  kid:{name:'小安',hair:'#3A2A22',shirt:'#3F7FD9',style:'short'},
  girl:{name:'小華',hair:'#4A2E1E',shirt:'#9B6FD6',style:'tails'},
  teacher:{name:'老師',hair:'#2B2020',shirt:'#2A9D8F',style:'bun',glasses:true},
  mom:{name:'媽媽',hair:'#5A3725',shirt:'#F08A3C',style:'long'},
  bro:{name:'哥哥',hair:'#2E2420',shirt:'#E0AE14',style:'spiky'}
};
function person(p,f,quiet){
  const P=PEOPLE[p],skin='#F7CFAE',ink='#22314A',sw='stroke="'+ink+'" stroke-width="3.5" stroke-linecap="round" fill="none"';
  let back='';
  if(P.style==='tails') back=`<circle cx="25" cy="88" r="15" fill="${P.hair}" stroke="${ink}" stroke-width="3"/><circle cx="115" cy="88" r="15" fill="${P.hair}" stroke="${ink}" stroke-width="3"/>`;
  if(P.style==='bun') back=`<circle cx="70" cy="30" r="17" fill="${P.hair}" stroke="${ink}" stroke-width="3"/>`;
  if(P.style==='long') back=`<path d="M24 76 Q24 30 70 30 Q116 30 116 76 L120 152 Q70 162 20 152Z" fill="${P.hair}" stroke="${ink}" stroke-width="3"/>`;
  const body=`<path d="M20 222 Q22 142 70 132 Q118 142 120 222Z" fill="${P.shirt}" stroke="${ink}" stroke-width="3"/><rect x="61" y="112" width="18" height="24" fill="${skin}"/>`;
  const head=`<circle cx="70" cy="78" r="43" fill="${skin}" stroke="${ink}" stroke-width="3"/>`;
  const top=P.style==='spiky'
    ?`<path d="M27 76 L31 42 L46 54 L54 31 L68 48 L80 27 L90 48 L104 35 L113 76 Q96 56 70 56 Q44 56 27 76Z" fill="${P.hair}"/>`
    :`<path d="M27 78 Q26 33 70 33 Q114 33 113 78 Q104 55 70 53 Q40 55 27 78Z" fill="${P.hair}"/>`;
  if(f==='away') return svg(back+body+head+`<circle cx="70" cy="77" r="43" fill="${P.hair}" stroke="${ink}" stroke-width="3"/>`);
  const eyes=`<circle cx="54" cy="81" r="4.8" fill="${ink}"/><circle cx="86" cy="81" r="4.8" fill="${ink}"/>`;
  const cheeks=`<circle cx="43" cy="95" r="6" fill="#F59C8C" opacity=".55"/><circle cx="97" cy="95" r="6" fill="#F59C8C" opacity=".55"/>`;
  const smile=`<path d="M57 97 Q70 111 83 97" ${sw}/>`;
  const frown=`<path d="M60 105 Q70 97 80 105" ${sw}/>`;
  const worry=`<path d="M44 70 L60 64" ${sw}/><path d="M96 70 L80 64" ${sw}/>`;
  let face='';
  switch(f){
    case 'happy': face=eyes+cheeks+smile;break;
    case 'look': face=eyes+`<path d="M62 99 Q70 105 78 99" ${sw}/>`;break;
    case 'talk': face=eyes+cheeks+`<ellipse class="mouth" cx="70" cy="101" rx="${quiet?5:10}" ry="${quiet?3.5:8}" fill="#9C2F3A" stroke="${ink}" stroke-width="2.5"/>`;break;
    case 'worried': face=eyes+worry+frown;break;
    case 'sad': face=eyes+worry+frown+`<path d="M50 89 Q46 97 50 100 Q54 97 50 89Z" fill="#6EC1F0"/>`;break;
    case 'stare': face=`<circle cx="54" cy="80" r="9.5" fill="#fff" stroke="${ink}" stroke-width="2.5"/><circle cx="58" cy="79" r="4.8" fill="${ink}"/><circle cx="86" cy="80" r="9.5" fill="#fff" stroke="${ink}" stroke-width="2.5"/><circle cx="90" cy="79" r="4.8" fill="${ink}"/><path d="M63 103 L77 103" ${sw}/>`;break;
    case 'confused': face=eyes+`<path d="M46 68 L60 68" ${sw}/><path d="M80 65 Q88 58 96 63" ${sw}/><path d="M60 103 Q65 99 70 103 Q75 107 80 103" ${sw}/><text x="116" y="42" font-size="34" font-weight="700" fill="${ink}" font-family="sans-serif">?</text>`;break;
  }
  if(P.glasses) face+=`<circle cx="54" cy="81" r="11" fill="none" stroke="${ink}" stroke-width="2.5"/><circle cx="86" cy="81" r="11" fill="none" stroke="${ink}" stroke-width="2.5"/><path d="M65 81 L75 81" stroke="${ink}" stroke-width="2.5"/>`;
  return svg(back+body+head+top+face);
}
function svg(inner){return `<svg viewBox="0 0 140 224" aria-hidden="true">${inner}</svg>`}

/* ---------- 小工具 ---------- */
const $=s=>document.querySelector(s);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleIdx(n){let o;do{o=shuffle([...Array(n).keys()]);}while(n>1&&o.every((v,i)=>v===i));return o;}
function starsHTML(n){return `<span class="stars" aria-label="${n} 顆星">${'<i class="on">★</i>'.repeat(n)}${'<i>★</i>'.repeat(3-n)}</span>`}
function today(){const d=new Date();return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`}
function esc(c){return c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':c}

/* ---------- 注音排版 ---------- */
const HAN_RUN=/[㐀-鿿豈-﫿]+/g, TRAIL=/[，。！？、：；」』）…～]/;
function seg(run){
  if(ZY[run])return ZY[run].split(' ');
  const out=[];let i=0;
  while(i<run.length){
    let hit=0;
    for(let L=Math.min(run.length-i,12);L>=2;L--){const sub=run.substr(i,L);if(ZY[sub]){out.push(...ZY[sub].split(' '));hit=L;break;}}
    if(hit){i+=hit;continue;}
    out.push(ZYC[run[i]]||'');i++;
  }
  return out;
}
function bp(z){
  if(!z)return '';
  let neutral=false,tone='';
  if(z[0]==='˙'){neutral=true;z=z.slice(1);}
  if('ˊˇˋ'.includes(z[z.length-1])){tone=z[z.length-1];z=z.slice(0,-1);}
  return `<span class="b" aria-hidden="true"><span class="bs">${neutral?'<i>˙</i>':''}${z}</span>${tone?`<span class="t">${tone}</span>`:''}</span>`;
}
function rb(s){
  s=String(s);
  const toks=[];let last=0;HAN_RUN.lastIndex=0;let m;
  while((m=HAN_RUN.exec(s))){
    for(const c of s.slice(last,m.index))toks.push({c});
    const zs=seg(m[0]);[...m[0]].forEach((c,k)=>toks.push({c,z:zs[k]||''}));
    last=m.index+m[0].length;
  }
  for(const c of s.slice(last))toks.push({c});
  let h='';
  for(let i=0;i<toks.length;i++){
    const t=toks[i];
    if(t.z!==undefined){
      let tail='';
      while(i+1<toks.length&&toks[i+1].z===undefined&&TRAIL.test(toks[i+1].c)){tail+=toks[++i].c;}
      h+=`<span class="zc">${t.c}${bp(t.z)}${tail}</span>`;
    }else h+=esc(t.c);
  }
  return h;
}

let soundOn=true,actx=null;
const hasTTS='speechSynthesis' in window;
function allVoices(){if(!hasTTS)return [];try{return speechSynthesis.getVoices();}catch(e){return [];}}
function zhVoices(){
  const rank=v=>/TW|Hant/i.test(v.lang)?0:/HK|yue/i.test(v.lang)?1:2;
  return allVoices().filter(v=>/^(zh|cmn|yue)/i.test(v.lang)).sort((a,b)=>rank(a)-rank(b));
}
function voiceFor(r){
  const c=cfg(r),all=allVoices();
  if(c.voice){const v=all.find(v=>v.voiceURI===c.voice);if(v)return v;}
  const zh=zhVoices(),tw=zh.filter(v=>/TW|Hant/i.test(v.lang)),pool=tw.length?tw:zh;
  return pool.length?pool[(AUTO_IDX[r]||0)%pool.length]:null;
}
function stopSpeech(){if(hasTTS)try{speechSynthesis.cancel();}catch(e){}}
function speak(text,role='narr'){
  const clean=String(text).replace(/[「」（）()]/g,' ').replace(/……/g,'，');
  return new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    const c=cfg(role),est=(700+clean.length*260)/c.rate;
    if(!soundOn||!hasTTS){setTimeout(fin,est);return;}
    try{
      const u=new SpeechSynthesisUtterance(clean),v=voiceFor(role);
      u.lang=v?v.lang:'zh-TW';if(v)u.voice=v;u.rate=c.rate;u.pitch=c.pitch;
      u.onend=fin;u.onerror=fin;setTimeout(fin,est*2+1500);
      if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(()=>speechSynthesis.speak(u),80);}
      else speechSynthesis.speak(u);
    }catch(e){setTimeout(fin,est);}
  });
}
function tone(ok){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime,notes=ok?[660,880,1175]:[330,262];
    notes.forEach((fr,i)=>{const o=actx.createOscillator(),g=actx.createGain(),s=t+i*.11;
      o.type=ok?'sine':'triangle';o.frequency.value=fr;
      g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.28);
      o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.3);});
  }catch(e){}
}

async function narrate(tok){
  const s=cur.u.story[cur.i];
  await speak(s.cap,'narr');
  if(tok!==cur.tok)return;
  if(s.say){
    const st=$('#stage');st.classList.add('talking');

    if(tok===cur.tok)st.classList.remove('talking');

async function playFrom(){
  stopSpeech();
  const tok=++cur.tok;cur.playing=true;updPlay();
  while(tok===cur.tok){
    await narrate(tok);
    if(tok!==cur.tok)return;
    const s=cur.u.story[cur.i];
    if(s.practice||cur.i>=cur.u.story.length-1){cur.playing=false;updPlay();return;}
    await wait(900);
    if(tok!==cur.tok)return;
    cur.i++;renderStep();
  }
}

function finish(){
  const u=gm.u,n=u.game.rounds.length,ratio=gm.firstOk/n;
  const st=ratio===1?3:ratio>=.6?2:1;
  const r=rec(u.id);r.stars=Math.max(r.stars,st);r.plays++;r.date=today();save();
  const title=st===3?'太棒了！全部第一次就答對！':st===2?'很不錯！再練習會更好！':'你很努力！我們再練習一次！';
  const box=$('#resBody');
  box.innerHTML=`<div class="rstars">${'<i style="color:#F2B01E">★</i>'.repeat(st)}${'<i style="color:#D5DEE6">★</i>'.repeat(3-st)}</div>
    <p class="rtitle">${rb(title)}</p>
    <div class="gnum">${rb(`第一次就答對：${gm.firstOk} / ${n} 題`)}</div>
    <div class="selfq">${rb('今天學會說的話，再大聲說一次：')}</div>
    <div class="keys">${u.keys.map((k,i)=>`<div class="key"><span class="k">${rb(k)}</span><button class="sayb" data-k="${i}" aria-label="聽這句話">🔊</button></div>`).join('')}</div>
    <div class="selfq">${rb('我覺得我自己……')}</div>
    <div class="selfrow">${[3,2,1].map(v=>`<button class="selfb${r.self===v?' on':''}" data-v="${v}"><em>${SELF[v].face}</em>${rb(SELF[v].text)}</button>`).join('')}</div>
    <div class="ctrl"><button class="btn" id="rAgain">🔁 ${rb('再玩一次')}</button><button class="btn" id="rStory">🎬 ${rb('再看動畫')}</button><button class="btn go" id="rHome">🏠 ${rb('回首頁')}</button></div>`;
  box.querySelectorAll('.key .sayb').forEach(b=>b.onclick=()=>speak(u.keys[+b.dataset.k],'kid'));
  box.querySelectorAll('.selfb').forEach(b=>b.onclick=()=>{
    const v=+b.dataset.v;r.self=v;save();
    box.querySelectorAll('.selfb').forEach(x=>x.classList.toggle('on',x===b));
    tone(true);speak(v===3?'我會了！好棒！':v===2?'有一點會，再練習就更棒了！':'沒關係，我們再多練習幾次！','teacher');
  });
  $('#rAgain').onclick=openGame;
  $('#rStory').onclick=()=>{show('unit');cur.i=0;renderStep();playFrom();};
  $('#rHome').onclick=goHome;
  show('result');
  speak(title+'你覺得自己學會了嗎？','teacher');
}

/* ---------- 學習紀錄 ---------- */
function renderRecord(){
  $('#recBody').innerHTML=UNITS.map(u=>{const r=rec(u.id);return `<tr><td><b>${u.title}</b><small>${u.week}・${u.code}</small></td><td>${starsHTML(r.stars)}</td><td>${r.self?SELF[r.self].face+' '+SELF[r.self].text:'—'}</td><td class="num">${r.said}</td><td class="num">${r.plays}</td><td>${r.date||'—'}</td></tr>`;}).join('');
  $('#recMsg').textContent='';
}
$('#copyRec').onclick=()=>{
  const txt='溝通小勇士 學習紀錄（'+today()+'）\n'+UNITS.map(u=>{const r=rec(u.id);return `${u.week} ${u.title}：星星 ${r.stars}/3，自評 ${r.self?SELF[r.self].text:'未填'}，開口練習 ${r.said} 次，遊戲 ${r.plays} 次，最近 ${r.date||'—'}`;}).join('\n');
  const done=()=>{$('#recMsg').textContent='已複製，可以貼到 IEP 或聯絡簿。';};
  try{navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done));}catch(e){fallbackCopy(txt,done);}
};
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand('copy');}catch(e){}
  ta.remove();if(ok)done();else $('#recMsg').textContent='這個瀏覽器不能自動複製，請直接選取表格文字。';
}
let resetArmed=null;
$('#resetRec').onclick=()=>{
  const b=$('#resetRec');
  if(!resetArmed){b.textContent='確定要清除？再按一次';resetArmed=setTimeout(()=>{resetArmed=null;b.textContent='清除紀錄';},4000);return;}
  clearTimeout(resetArmed);resetArmed=null;b.textContent='清除紀錄';
  store={units:{}};save();renderRecord();$('#recMsg').textContent='紀錄已清除。';
};

document.querySelectorAll('[data-zy]').forEach(el=>el.innerHTML=rb(el.textContent));
applyZy();updPlay();renderHome();
</script>
